name: Release

# Push a tag such as v1.0.0: builds the Windows installer and the portable zip, checks the build with its own
# self-test (software OpenGL: the build machine has no GPU) and publishes them on the GitHub release page.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, ".")
          from dcv import __version__
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != __version__:
              sys.exit(f"tag v{tag} but dcv.__version__ is {__version__}")

      - name: Build, self-test, installer
        run: python packaging/build.py --installer --selftest-modes software

      - uses: actions/upload-artifact@v4
        with:
          name: SoEasy-DICOM-Viewer-windows
          path: |
            dist/*-Setup.exe
            dist/*-portable.zip
            dist/SHA256SUMS.txt
            packaging/build/selftest_*.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*-Setup.exe
            dist/*-portable.zip
            dist/SHA256SUMS.txt

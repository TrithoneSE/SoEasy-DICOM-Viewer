# The web version's source lives in web/. Every change is tested and built here; the built site is then published to
# TrithoneSE/SoEasy-DICOM-Web, which keeps the public address https://trithonese.github.io/SoEasy-DICOM-Web/.
# Publishing needs a repository secret WEB_DEPLOY_TOKEN: a fine-grained token with Contents: write on that repository.
# Without the secret the workflow only tests and builds.
name: Web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish the built site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.WEB_DEPLOY_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No WEB_DEPLOY_TOKEN secret: built and tested only."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/TrithoneSE/SoEasy-DICOM-Web.git" site
          cp site/README.md /tmp/site-readme.md
          rm -rf site/*
          cp -r dist/. site/
          cp /tmp/site-readme.md site/README.md
          touch site/.nojekyll
          cd site
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Site unchanged."
          else
            git commit -m "Build of TrithoneSE/SoEasy-DICOM-Viewer@${SHA}"
            git push
          fi
